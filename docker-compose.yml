services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - '5173:3000'

    environment:
      DATABASE_URL: postgresql://artshow:${POSTGRES_PASSWORD}@database:5432/artshow

      S3_URL: ${S3_URL}

      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}

      IDP_URL: ${IDP_URL}
      IDP_CLIENT_ID: ${IDP_CLIENT_ID}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET}

      ATTSRV_URL: ${ATTSRV_URL}

    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18
    restart: unless-stopped

    ports:
      - '5432:5432'

    environment:
      POSTGRES_USER: artshow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: artshow

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artshow -d artshow']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
